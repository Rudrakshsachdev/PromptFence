name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptfence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest httpx anyio
          cd backend
          pip install -e .

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check app/ tests/

      - name: Run Ruff Formatter Check
        run: |
          cd backend
          ruff format --check app/ tests/

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/promptfence_test
          SECRET_KEY: ci-test-secret-key-minimum-thirty-two-chars-long
          ENVIRONMENT: test
        run: |
          cd backend
          python -m pytest tests/unit -v --durations=10

